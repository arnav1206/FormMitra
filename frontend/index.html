<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormMitra (भारत FormMitra) — AI Voice-Powered Scheme & Form Assistant</title>
    <meta name="description" content="AI Voice-Assisted Form Filling in 9 Indian Languages. Powered by Gemini 2.0 AI and Groq Speech Recognition." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        const saved = localStorage.getItem('formmitra_dark_mode');
        // Default to dark mode (true) if nothing in localStorage
        if (saved === 'false') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F5F3FC] text-[#1A1625] dark:bg-[#0A0611] dark:text-[#F5F3FA] antialiased selection:bg-fuchsia-400/40 selection:text-inherit transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
